{% extends 'base.html' %}

{% block title %}Login | CRACK THE CODE{% endblock %}

{% block content %}
<section class="section">
  <div class="container">
    <div class="panel form-card">
      <h2>Welcome back</h2>
      <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
      <p style="margin-top: 14px;"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
    </div>
  </div>
</section>
{% endblock %}
